name: Warm the release cache

# Release runs are triggered by tags, and a tag run can only restore caches
# saved by that tag or by master. This builds the release profile's
# dependencies on master whenever they change, so the next release starts
# with them compiled instead of building them all from scratch.
on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - .github/workflows/warm-cache.yml
      - .github/workflows/release.yml
  # Checks a change to this workflow; the cache is only saved on master.
  pull_request:
    paths:
      - .github/workflows/warm-cache.yml
  # Run by hand after a new stable Rust, which changes the cache key.
  workflow_dispatch:

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

# Must match release.yml: CARGO* variables are part of the cache key.
env:
  CARGO_TERM_COLOR: always

jobs:
  warm:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Same shared key as release.yml; the key also carries the OS and CPU.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          # Same packages as release.yml.
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libdbus-1-dev \
            vulkan-validationlayers libvulkan1

      # Only dependencies are cached (rust-cache drops the workspace crates'
      # own build output), so empty every workspace crate: cargo still builds
      # every dependency, but skips compiling and linking the app itself.
      # Dependency builds don't depend on the workspace's source, so the
      # release build reuses them as they are.
      - name: Stub out the workspace crates
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[]
                | select(.kind[0] | IN("bin", "lib", "rlib", "dylib", "cdylib", "staticlib", "proc-macro"))
                | "\(.kind[0]) \(.src_path)"' \
            | tr -d '\r' \
            | while read -r kind path; do
                if [ "$kind" = bin ]; then echo 'fn main() {}' > "$path"; else : > "$path"; fi
              done

      - name: Build dependencies
        run: cargo build --release --locked

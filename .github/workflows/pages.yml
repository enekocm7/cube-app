name: Pages

on:
  push:
    branches: [master]
    paths: ["website/**", "fonts/**", "assets/logo.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy branding
        run: |
          cp assets/logo.svg website/public/logo.svg

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build website
        working-directory: website
        run: bun run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4

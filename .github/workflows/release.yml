name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build the packages and upload them as workflow artifacts
  # without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            # The workspace keeps a single version in [workspace.package].
            $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $version = ($meta.packages | Where-Object { $_.name -eq "cube-gui" }).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceExe=$pwd\target\release\cube.exe" `
            "/DIconFile=$pwd\target\cube.ico" `
            "/DOutputDir=$pwd\dist" `
            installer\cube.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item target\release\cube.exe, README.md, LICENSE staging\
          Compress-Archive -Path staging\* -DestinationPath "dist\cube-$v-portable-x64.zip" -Force
          Get-ChildItem dist | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist\SHA256SUMS-windows.txt
          Get-Content dist\SHA256SUMS-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cube-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: cube ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: linux-x64
          - name: macOS arm64
            os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          # GPUI build inputs on Ubuntu 24.04, from the gpui-kit install guide.
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            vulkan-validationlayers libvulkan1

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # The workspace keeps a single version in [workspace.package].
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "cube-gui") | .version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          t="${{ matrix.target }}"
          mkdir -p staging dist
          cp target/release/cube README.md LICENSE staging/
          tar -czf "dist/cube-$v-$t.tar.gz" -C staging .
          (cd dist && shasum -a 256 ./* > "SHA256SUMS-$t.txt")
          cat "dist/SHA256SUMS-$t.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cube-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: cube ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

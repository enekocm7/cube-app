[workspace]
resolver = "3"
members = [
    "crates/cube-bluetooth",
    "crates/cube-core",
    "crates/cube-locale",
    "crates/cube-ui",
    "crates/cube-updater",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/enekocm7/cube-app"

[workspace.dependencies]
cube-bluetooth = { path = "crates/cube-bluetooth" }
cube-core = { path = "crates/cube-core" }
cube-locale = { path = "crates/cube-locale" }
cube-ui = { path = "crates/cube-ui" }
cube-updater = { path = "crates/cube-updater" }

anyhow = "1"
btleplug = "0.13.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
flate2 = "1"
flume = "0.12"
futures-util = "0.3"
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rodio = { version = "0.22.2", features = ["mp3"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tar = "0.4"
tnoodle-rs = "0.1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
ttf-parser = "0.25"
ureq = "3"
uuid = "1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Colors read better as plain hex.
unreadable_literal = "allow"

[package]
name = "cube-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop timer and session manager for speedcubing"
build = "build.rs"

[[bin]]
name = "cube"
path = "src/main.rs"

[dependencies]
cube-ui.workspace = true
cube-updater.workspace = true

[build-dependencies]
embed-resource = "3"
resvg = { version = "0.45", default-features = false }

[lints]
workspace = true

# The scramble solvers are ~10x slower unoptimized.
[profile.dev.package.tnoodle-rs]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# gpui is huge: dependencies build with parallel codegen.
[profile.release.package."*"]
codegen-units = 16
